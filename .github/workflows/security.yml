name: security
on:
  push:
  pull_request:
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: pip install -e . pip-audit bandit
      - run: pip-audit
      - run: bandit -q -r src -x tests
