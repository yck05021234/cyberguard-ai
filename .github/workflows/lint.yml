name: lint
on: [push, pull_request]
permissions:
  contents: read
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: pip install ruff
      - run: ruff check src tests scripts examples/plugin-template/src
      - run: ruff format --check src tests scripts examples/plugin-template/src
