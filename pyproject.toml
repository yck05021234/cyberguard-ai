[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cyberguard-ai"
version = "0.9.0"
description = "Local-first system diagnostics and cyber incident triage"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-multipart>=0.0.9",
  "streamlit>=1.37,<2",
  "httpx>=0.27,<1",
  "psutil>=6,<8",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.6,<1"]

[project.scripts]
cyberguard = "cyberguard.main:main"
cyberguard-agent = "cyberguard.agent.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cyberguard"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "E701", "E702"]
